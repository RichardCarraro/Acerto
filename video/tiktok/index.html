<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="tiktok-roteiro.js"></script>
    <style>
      :root {
        --azul: #1e63d6;
        --roxo: #5e45a8;
        --lilas: #dccbf7;
        --noite: #0b1530;
        --fundo: #f3f5fa;
        --tinta: #14213d;
        --cinza: #5b6474;
        --erro: #ff5a3c;
        --font: "Acerto Sans", sans-serif;
      }
      @font-face { font-family: "Acerto Sans"; font-weight: 400; src: local("Segoe UI"), local("SegoeUI"); }
      @font-face { font-family: "Acerto Sans"; font-weight: 600; src: local("Segoe UI Semibold"), local("SegoeUI-Semibold"); }
      @font-face { font-family: "Acerto Sans"; font-weight: 700; src: local("Segoe UI Bold"), local("SegoeUI-Bold"); }
      @font-face { font-family: "Acerto Sans"; font-weight: 900; src: local("Segoe UI Black"), local("SegoeUI-Black"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--noite); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); color: #fff; overflow: hidden; }
      .cena { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
      .noite { background: radial-gradient(ellipse at 50% 40%, #16295a 0%, var(--noite) 70%); }
      .claro { background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, var(--fundo) 75%); color: var(--tinta); }
      .azul { background: radial-gradient(ellipse at 50% 35%, #3a82f2 0%, var(--azul) 50%, #123f8f 100%); }
      .media { font-size: 84px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
      .cursor { display: inline-block; width: 8px; background: currentColor; vertical-align: -0.12em; margin-left: 6px; height: 0.95em; }
      .hl { background: var(--lilas); color: var(--tinta); border-radius: 0.16em; padding: 0 0.1em; margin: 0 -0.1em; }
      .oculto { display: none; }

      /* 1. gancho */
      #nao { position: relative; font-size: 280px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; margin: 30px 0 70px; }
      #onda { position: absolute; left: 4%; right: 4%; bottom: -34px; height: 40px; transform-origin: left center; }
      #semacento { color: var(--erro); }

      /* 2. apagando */
      #apagando { font-size: 220px; font-weight: 900; letter-spacing: -0.04em; margin: 50px 0; color: var(--erro); }

      /* 3. logo */
      #onda3 { position: absolute; width: 2600px; height: 2600px; border-radius: 50%; background: var(--azul); left: -760px; top: -340px; }
      .anel { position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 6px solid rgba(255,255,255,.7); left: 330px; top: 520px; }
      #logo3 { width: 300px; height: 300px; position: relative; filter: drop-shadow(0 30px 60px rgba(0,0,0,.3)); }
      #nome3 { font-size: 180px; font-weight: 900; letter-spacing: -0.04em; margin-top: 30px; position: relative; }
      #sub3 { font-size: 54px; font-weight: 600; opacity: .95; position: relative; }

      /* 4. digitação */
      #rotulo4 { font-size: 46px; font-weight: 600; color: var(--cinza); }
      #cartao { width: 940px; min-height: 560px; margin-top: 40px; background: #fff; border-radius: 40px; padding: 64px 60px; text-align: left; font-size: 80px; line-height: 1.32; color: var(--tinta); box-shadow: 0 40px 90px rgba(20,33,61,.16), 0 0 0 2px rgba(20,33,61,.06); }
      #tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 56px; width: 940px; min-height: 200px; }
      .tag { font-size: 44px; font-weight: 700; color: #fff; background: var(--roxo); border-radius: 999px; padding: 14px 34px; }
      #semclicar { margin-top: 40px; color: var(--tinta); }

      /* 5. trocas */
      .painel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .painel .rot { font-size: 46px; font-weight: 600; opacity: .8; margin-bottom: 40px; }
      .painel .palavra { font-size: 150px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.2; }

      /* 6. chips */
      #chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; width: 920px; margin-top: 80px; }
      .chip { font-size: 56px; font-weight: 700; background: #fff; color: var(--tinta); border-radius: 26px; padding: 26px 44px; box-shadow: 0 16px 40px rgba(20,33,61,.10), 0 0 0 2px rgba(20,33,61,.06); }

      /* 7. telas */
      #c7 { justify-content: flex-start; padding-top: 250px; }
      #linhas7 .media { font-size: 96px; font-weight: 900; }
      #tela7 { position: absolute; left: 90px; top: 760px; width: 830px; border-radius: 22px; box-shadow: 0 50px 100px rgba(0,0,0,.35); }
      #flyout7 { position: absolute; left: 610px; top: 1300px; width: 400px; border-radius: 18px; box-shadow: 0 40px 80px rgba(0,0,0,.35); }

      /* 8. chamada */
      #logo8 { width: 240px; height: 240px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.3)); }
      #nome8 { font-size: 170px; font-weight: 900; letter-spacing: -0.04em; margin-top: 20px; }
      #baixe8 { margin-top: 60px; font-size: 72px; font-weight: 900; color: var(--azul); background: #fff; border-radius: 30px; padding: 30px 70px; }
      #link8 { margin-top: 44px; font-size: 44px; font-weight: 600; }
      #info8 { margin-top: 18px; font-size: 40px; opacity: .85; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <audio id="som" src="assets/tiktok-som.wav" data-start="0" data-duration="32"></audio>

      <section id="c1" class="cena noite clip" data-start="0" data-duration="2.7">
        <div id="h1a" class="media">Você ainda escreve</div>
        <div id="nao">nao<svg id="onda" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 20 Q 12.5 0 25 20 T 50 20 T 75 20 T 100 20 T 125 20 T 150 20 T 175 20 T 200 20 T 225 20 T 250 20 T 275 20 T 300 20 T 325 20 T 350 20 T 375 20 T 400 20" fill="none" stroke="#ff5a3c" stroke-width="7" /></svg></div>
        <div id="semacento" class="media">sem acento?</div>
      </section>

      <section id="c2" class="cena noite clip" data-start="2.7" data-duration="2.3">
        <div id="h2a" class="media">E perde tempo</div>
        <div id="apagando"></div>
        <div id="h2b" class="media">corrigindo na mão?</div>
      </section>

      <section id="c3" class="cena noite clip" data-start="4.95" data-duration="3">
        <div id="onda3"></div>
        <div class="anel"></div><div class="anel"></div>
        <img id="logo3" src="assets/logo.png" alt="" />
        <div id="nome3">Acertô</div>
        <div id="sub3">corrige enquanto você digita</div>
      </section>

      <section id="c4" class="cena claro clip" data-start="7.9" data-duration="7.1">
        <div id="rotulo4">Em qualquer programa do Windows</div>
        <div id="cartao"></div>
        <div id="tags"></div>
        <div id="semclicar" class="media">Sem clicar em nada.</div>
      </section>

      <section id="c5" class="cena clip" data-start="15" data-duration="5.8"></section>

      <section id="c6" class="cena claro clip" data-start="20.75" data-duration="3.45">
        <div id="t6" class="media">Funciona em<br />qualquer lugar</div>
        <div id="chips"></div>
      </section>

      <section id="c7" class="cena azul clip" data-start="24.1" data-duration="3.7">
        <div id="linhas7"><div class="media">Grátis.</div><div class="media">Offline.</div><div class="media">Em português.</div></div>
        <img id="tela7" src="assets/main-home-claro.png" alt="" />
        <img id="flyout7" src="assets/flyout-claro.png" alt="" />
      </section>

      <section id="c8" class="cena azul clip" data-start="27.7" data-duration="4.3">
        <img id="logo8" src="assets/logo.png" alt="" />
        <div id="nome8">Acertô</div>
        <div id="baixe8">Baixe grátis</div>
        <div id="link8">github.com/RichardCarraro/Acerto</div>
        <div id="info8">Windows 10 e 11</div>
      </section>
    </div>
    <script>
      const R = window.ROTEIRO;
      const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
      const letras = (pai, texto) => [...texto].map((ch) => pai.appendChild(el("span", "oculto", ch)));
      const cursor = () => el("span", "cursor");

      // monta o DOM a partir do roteiro (antes da timeline)
      const apag = document.getElementById("apagando");
      const letrasApaga = [...R.apaga.palavra].map((ch) => apag.appendChild(el("span", null, ch)));
      const cur2 = apag.appendChild(cursor());

      const cartao = document.getElementById("cartao");
      const tags = document.getElementById("tags");
      const frase = R.frase.map((p) => {
        const w = cartao.appendChild(el("span"));
        const dig = w.appendChild(el("span"));
        const ls = letras(dig, p.d);
        const fixo = p.c ? w.appendChild(el("span", "oculto")) : null;
        if (fixo) fixo.appendChild(el("span", "hl", p.c));
        const esp = w.appendChild(el("span", "oculto", " "));
        const tag = p.tag ? tags.appendChild(el("div", "tag", "✓ " + p.tag)) : null;
        return { p, dig, ls, fixo, esp, tag };
      });
      const cur4 = cartao.appendChild(cursor());

      const c5 = document.getElementById("c5");
      const cores = ["#1e63d6", "#5e45a8", "#0b1530", "#1e63d6", "#5e45a8"];
      const paineis = R.trocas.map((x, i) => {
        const pn = c5.appendChild(el("div", "painel"));
        pn.style.background = cores[i % cores.length];
        pn.style.zIndex = i + 1;
        pn.appendChild(el("div", "rot", i % 2 ? "você digita" : "você digita…"));
        const pal = pn.appendChild(el("div", "palavra"));
        const dig = pal.appendChild(el("span"));
        const ls = letras(dig, x.d);
        const cur = pal.appendChild(cursor());
        const fixo = pal.appendChild(el("span", "hl oculto", x.c));
        const rot2 = pn.appendChild(el("div", "rot oculto", "o Acertô acerta"));
        rot2.style.margin = "40px 0 0";
        return { x, pn, dig, ls, cur, fixo, rot2 };
      });

      const chips = document.getElementById("chips");
      const chipEls = R.chips.map((c) => chips.appendChild(el("div", "chip", c.nome)));

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      const mostra = (e, t) => tl.set(e, { display: "inline" }, t);
      const esconde = (e, t) => tl.set(e, { display: "none" }, t);
      const pisca = (e, de, ate) => tl.to(e, { opacity: 0, duration: 0.01, repeat: Math.max(1, Math.floor((ate - de) / 0.45)), yoyo: true, repeatDelay: 0.44 }, de);
      const entra = (alvo, t, extra = {}) => tl.from(alvo, { opacity: 0, y: 60, duration: 0.45, ease: "power3.out", ...extra }, t);
      const corrige = (fixo, t, extra = {}) => {
        tl.from(fixo.querySelector(".hl") || fixo, { backgroundColor: "#a77df2", duration: 0.9, ...extra }, t);
      };

      // 1. gancho
      entra("#h1a", 0.02, { duration: 0.3 });
      tl.from("#nao", { opacity: 0, scale: 2.4, duration: 0.3, ease: "expo.out" }, 0.3);
      tl.to("#nao", { keyframes: { x: [0, -18, 16, -10, 6, 0] }, duration: 0.35 }, 0.6);
      tl.from("#onda", { scaleX: 0, duration: 0.3, ease: "power2.out" }, 1.3);
      entra("#semacento", 1.55, { scale: 0.8, y: 0, ease: "back.out(2)" });
      tl.to("#c1 > *", { opacity: 0, scale: 0.9, duration: 0.2 }, 2.5);

      // 2. apagando na mão
      entra("#h2a", 2.75, { duration: 0.3 });
      entra("#apagando", 2.9, { duration: 0.3, y: 30 });
      [...letrasApaga].reverse().forEach((l, i) => esconde(l, R.apaga.tempos[i]));
      pisca(cur2, 2.9, 4.9);
      entra("#h2b", 4.1, { duration: 0.35 });

      // 3. logo
      tl.from("#onda3", { scale: 0, duration: 0.45, ease: "power3.in" }, 4.95);
      tl.from("#logo3", { scale: 0, rotation: -25, duration: 0.6, ease: "back.out(2.2)" }, 5.35);
      tl.fromTo("#c3 .anel", { scale: 0.6, opacity: 1 }, { scale: 3, opacity: 0, duration: 1.1, stagger: 0.2, ease: "power2.out" }, 5.35);
      entra("#nome3", 5.6, { y: 80, duration: 0.5 });
      entra("#sub3", 5.95);
      tl.to(["#logo3", "#nome3", "#sub3"], { y: -80, opacity: 0, duration: 0.3, ease: "power2.in" }, 7.6);

      // 4. digitação com correção na hora
      entra("#rotulo4", 7.95, { duration: 0.35 });
      entra("#cartao", 8.05, { y: 120, scale: 0.92, duration: 0.5 });
      pisca(cur4, 8.1, 14.8);
      frase.forEach(({ p, dig, ls, fixo, esp, tag }) => {
        ls.forEach((l, i) => mostra(l, p.letras[i]));
        mostra(esp, p.espaco);
        if (p.fix) {
          esconde(dig, p.fix);
          mostra(fixo, p.fix);
          corrige(fixo, p.fix);
          tl.from(tag, { scale: 0, opacity: 0, duration: 0.35, ease: "back.out(2.5)" }, p.fix);
        }
      });
      entra("#semclicar", 13.2, { scale: 0.85, y: 0, ease: "back.out(2)" });
      tl.to("#c4 > *", { opacity: 0, y: -60, duration: 0.25, stagger: 0.04 }, 14.75);

      // 5. trocas rápidas
      paineis.forEach(({ x, pn, dig, ls, cur, fixo, rot2 }, i) => {
        tl.from(pn, { yPercent: 100, duration: 0.22, ease: "power3.out" }, x.t);
        ls.forEach((l, k) => mostra(l, x.letras[k]));
        esconde(dig, x.fix);
        esconde(cur, x.fix);
        tl.set(fixo, { display: "inline-block" }, x.fix); // inline-block para a escala funcionar
        tl.set(rot2, { display: "block" }, x.fix);
        tl.from(fixo, { scale: 1.3, duration: 0.3, ease: "back.out(3)", transformOrigin: "50% 50%" }, x.fix);
        corrige(fixo, x.fix);
      });

      // 6. em qualquer lugar
      entra("#t6", 20.8, { duration: 0.4 });
      chipEls.forEach((c, i) => tl.from(c, { scale: 0, opacity: 0, duration: 0.35, ease: "back.out(2.5)" }, R.chips[i].t));
      tl.to("#c6 > *", { opacity: 0, scale: 0.94, duration: 0.2 }, 24.0);

      // 7. telas
      tl.from("#linhas7 .media", { opacity: 0, x: -120, stagger: 0.28, duration: 0.4, ease: "power3.out" }, 24.2);
      tl.fromTo("#tela7", { y: 700, rotationX: 28, rotationY: -18, transformPerspective: 1800 }, { y: 0, rotationX: 8, rotationY: -6, transformPerspective: 1800, duration: 0.9, ease: "power3.out" }, 24.3);
      tl.to("#tela7", { rotationX: 2, rotationY: 0, y: -20, duration: 2.4, ease: "none" }, 25.2);
      tl.from("#flyout7", { x: 500, rotation: 12, duration: 0.6, ease: "back.out(1.6)" }, 25.0);

      // 8. chamada
      tl.from("#logo8", { scale: 0, duration: 0.5, ease: "back.out(2)" }, 28.0);
      entra("#nome8", 28.25);
      entra("#baixe8", 28.6, { scale: 0.7, y: 0, ease: "back.out(2.2)" });
      entra("#link8", 28.9);
      entra("#info8", 29.1);
      tl.to("#baixe8", { scale: 1.06, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 29.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
